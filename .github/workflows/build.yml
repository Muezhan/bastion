name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Build inside an old, glibc-pinned base instead of the runner's own
    # (frequently-bumped) glibc - a PyInstaller binary only runs on a glibc
    # >= the one it was built against, never older. Debian 12 (glibc 2.36)
    # is the current Debian stable (valid repos, unlike 11's expired
    # security archive) and still covers most hosts in the wild.
    container: debian:12-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip openssl ca-certificates binutils

      - name: Install build dependencies
        # This container is ephemeral (torn down after the job), so
        # overriding Debian's PEP 668 system-package guard is safe here.
        run: pip3 install --no-cache-dir --break-system-packages -r requirements-build.txt

      - name: Build bastion-server
        run: python3 -m PyInstaller --onefile --name bastion-server-linux server_main.py

      - name: Build bastion-client
        run: python3 -m PyInstaller --onefile --name bastion-client-linux client_main.py

      - name: Smoke test binaries
        run: |
          ./dist/bastion-server-linux --help
          ./dist/bastion-client-linux --help

      - uses: actions/upload-artifact@v4
        with:
          name: bastion-linux-binaries
          path: |
            dist/bastion-server-linux
            dist/bastion-client-linux

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bastion-server-linux
            dist/bastion-client-linux
