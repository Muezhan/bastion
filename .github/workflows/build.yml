name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # manylinux2014 (CentOS 7 base, glibc 2.17) is the standard base the
    # Python packaging project maintains specifically for building portable
    # Linux binaries - a PyInstaller binary only runs on a glibc >= the one
    # it was built against, never older, so building against the oldest
    # widely-usable glibc covers virtually every real-world Linux host.
    container: quay.io/pypa/manylinux2014_x86_64
    env:
      PYBIN: /opt/python/cp311-cp311/bin
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: $PYBIN/pip install --no-cache-dir -r requirements-build.txt

      - name: Build bastion-server
        run: $PYBIN/pyinstaller --onefile --name bastion-server-linux server_main.py

      - name: Build bastion-client
        run: $PYBIN/pyinstaller --onefile --name bastion-client-linux client_main.py

      - name: Smoke test binaries
        run: |
          ./dist/bastion-server-linux --help
          ./dist/bastion-client-linux --help

      - uses: actions/upload-artifact@v4
        with:
          name: bastion-linux-binaries
          path: |
            dist/bastion-server-linux
            dist/bastion-client-linux

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bastion-server-linux
            dist/bastion-client-linux
